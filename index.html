  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Menu Especial de Natal | Toronto Cuisine Gourmet">

  <title>Menu Especial de Natal | Toronto Cuisine Gourmet</title>
  <style>
    /* A4 visual: each entire page is preserved as an image without cropping. */
    :root { color-scheme: light; background: #f9e7ec; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #f9e7ec; -webkit-text-size-adjust: 100%; }
    main { max-width: 794px; margin: 0 auto; }
    .pagina { margin: 0 0 18px; padding: 0; background: #f5ccd6;
              box-shadow: 0 5px 26px rgba(99, 38, 62, .13); }
    .pagina img { display: block; width: 100%; height: auto; aspect-ratio: 1055 / 1491;
                  border: none; margin: 0; object-fit: contain; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0;
               margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0);
               white-space: nowrap; border: 0; }
    .scroll-hint { display: none; }
    @media (max-width: 794px) {
      .pagina { margin-bottom: 0; box-shadow: none; }
      #pagina-01 {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        background: #f9e7ec;
      }
      #pagina-01 img {
        width: 100%;
        max-height: 100dvh;
        object-fit: contain;
      }
      .scroll-hint {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        color: #8c3855;
        text-decoration: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        opacity: 0.8;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        animation: hintBounce 2.2s ease-in-out infinite;
      }
      @keyframes hintBounce {
        0%, 100% { transform: translate(-50%, 0); }
        50% { transform: translate(-50%, 5px); }
      }
    }
    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body, main { width: 210mm; max-width: none; margin: 0; padding: 0; background: white; }
      .scroll-hint { display: none !important; }
      .pagina { width: 210mm; height: 297mm; margin: 0; box-shadow: none;
                break-after: page; page-break-after: always; overflow: hidden; }
      .pagina:last-child { break-after: auto; page-break-after: auto; }
      .pagina img { display: block; width: 100%; height: 100%; object-fit: contain; }
    }
  </style>
</head>
<body>
  <h1 class="sr-only">Menu Especial de Natal — 7ª edição — Toronto Cuisine Gourmet</h1>
  <main aria-label="Cardápio de Natal com oito páginas">
      <section class="pagina" id="pagina-01" aria-label="Página 1 de 8">
        <img src="assets/01-capa.webp" width="1055" height="1491"
             alt="Capa: Menu Especial de Natal, 7ª edição, Toronto Cuisine Gourmet"
             loading="eager" decoding="async" fetchpriority="high">
        <a href="#pagina-02" class="scroll-hint" aria-label="Ver cardápio">
          <span>Role para ver o cardápio</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </a>
      </section>
      <section class="pagina" id="pagina-02" aria-label="Página 2 de 8">
        <img src="assets/02-brindes.webp" width="1055" height="1491"
             alt="Brinde Especial de Natal: brindes para compras acima de 150 e 250 dólares"
             loading="lazy" decoding="async">
      </section>
      <section class="pagina" id="pagina-03" aria-label="Página 3 de 8">

      <section class="pagina" id="pagina-05" aria-label="Página 5 de 8">

             alt="Guirlandas Natalinas e Brigadeiros Gourmet, com opções e preços"

      </section>
      <section class="pagina" id="pagina-07" aria-label="Página 7 de 8">
        <img src="assets/07-salgados.webp" width="1055" height="1491"
             alt="Salgados: salgadinhos e pratos prontos"

      </section>
      <section class="pagina" id="pagina-08" aria-label="Página 8 de 8">
        <img src="assets/08-informacoes.webp" width="1055" height="1491"
             alt="Informações Importantes: decoração, pagamento e mensagem de Natal"

</html>
